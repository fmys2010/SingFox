name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - { mac_arch: arm64, go_arch: arm64, label: arm64 }
          - { mac_arch: x86_64, go_arch: amd64, label: x64 }
    steps:
      - name: Checkout SingFox
        uses: actions/checkout@v4

      - name: Checkout singbox-x
        uses: actions/checkout@v4
        with:
          repository: fmys2010/singbox-x
          path: singbox-x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build SingFox (${{ matrix.label }})
        run: |
          chmod +x tools/build_macos.sh
          ./tools/build_macos.sh --arch "${{ matrix.mac_arch }}" --source "$GITHUB_WORKSPACE/singbox-x"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SingFox-macos-${{ matrix.label }}
          path: build/macos-dist/*.dmg

      - name: Attach DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/macos-dist/*.dmg --clobber
