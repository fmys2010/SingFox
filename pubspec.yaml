name: singfox
description: "SingFox — a sing-box desktop client."
publish_to: 'none'
version: 0.1.1-beta+2

environment:
  sdk: ^3.13.4

dependencies:
  country_flags: ^4.1.2
  ffi: ^2.2.0
  file_picker: ^8.0.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  tray_manager: ^0.5.2
  web_socket_channel: ^3.0.3
  win32: 5.15.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/schema/
    - assets/tray/
    - assets/sites/
